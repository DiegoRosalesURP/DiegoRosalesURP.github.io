name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build y lint
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar HTML con HTMLHint
        run: npx htmlhint index.html

      - name: Validar JavaScript
        run: node --check libro-de-visitas.js

      - name: Validar Python con Ruff
        run: |
          pip install ruff==0.13.1
          ruff check api tests

      - name: Validar Dockerfile de API
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --entrypoint hadolint \
            hadolint/hadolint \
            api/Dockerfile

      - name: Validar Dockerfile de Web
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --entrypoint hadolint \
            hadolint/hadolint \
            web/Dockerfile

      - name: Validar Dockerfile de DB
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --entrypoint hadolint \
            hadolint/hadolint \
            db/Dockerfile

      - name: Crear sitio para publicación
        run: |
          rm -rf _site
          mkdir -p _site

          cp index.html _site/
          cp estilos.css _site/
          cp libro-de-visitas.js _site/

      - name: Verificar contenido de _site
        run: |
          test -f _site/index.html
          test -f _site/estilos.css
          test -f _site/libro-de-visitas.js

          echo "Contenido de _site:"
          find _site -maxdepth 1 -type f -print

      - name: Subir artifact de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Subir artifact para pruebas
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Descargar sitio generado
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Ejecutar pruebas del sitio
        run: npm test

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias de API
        run: pip install -r api/requirements.txt

      - name: Ejecutar pruebas de API
        run: PYTHONPATH=. pytest tests/test_api.py

  package:
    name: Package
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar metadatos de imagen web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/perfil-web
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Generar metadatos de imagen API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/perfil-api
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Construir y publicar imagen web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

      - name: Construir y publicar imagen API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

  security:
    name: Security
    needs: package
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Generar tag de las imágenes
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Escanear imagen web con Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: "ghcr.io/diegorosalesurp/perfil-web:${{ env.IMAGE_TAG }}"
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Escanear imagen API con Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: "ghcr.io/diegorosalesurp/perfil-api:${{ env.IMAGE_TAG }}"
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  smoke:
    name: Smoke
    needs: security
    runs-on: ubuntu-latest

    steps:
      - name: Generar tag de la imagen
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar imagen web publicada
        run: docker pull "ghcr.io/diegorosalesurp/perfil-web:${IMAGE_TAG}"

      - name: Levantar contenedor web
        run: |
          docker run -d \
            --name smoke-web \
            -p 8080:8080 \
            "ghcr.io/diegorosalesurp/perfil-web:${IMAGE_TAG}"

      - name: Ejecutar smoke test
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080/ > response.html; then
              echo "El sitio respondió correctamente."
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "El sitio no respondió dentro del tiempo permitido."
              docker logs smoke-web
              exit 1
            fi

            sleep 1
          done

          echo "Código HTTP:"
          curl --silent --output /dev/null --write-out "%{http_code}\n" http://localhost:8080/

          grep -q "Diego Alejandro Rosales Enciso" response.html

          echo "Smoke test exitoso: HTTP 200 y nombre encontrado."

      - name: Limpiar contenedor
        if: always()
        run: docker rm -f smoke-web

  deploy-prod:
    name: Deploy
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Preparar despliegue
        run: echo "Etapa de despliegue preparada para B7"