name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build y lint
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar HTML con HTMLHint
        run: npx htmlhint index.html

      - name: Validar JavaScript
        run: node --check libro-de-visitas.js

      - name: Validar Python con Ruff
        run: |
          pip install ruff==0.13.1
          ruff check api tests

      - name: Validar Dockerfile de API
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --entrypoint hadolint \
            hadolint/hadolint \
            api/Dockerfile

      - name: Validar Dockerfile de Web
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --entrypoint hadolint \
            hadolint/hadolint \
            web/Dockerfile

      - name: Validar Dockerfile de DB
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --entrypoint hadolint \
            hadolint/hadolint \
            db/Dockerfile

      - name: Crear sitio para publicación
        run: |
          rm -rf _site
          mkdir -p _site

          cp index.html _site/
          cp estilos.css _site/
          cp libro-de-visitas.js _site/

      - name: Verificar contenido de _site
        run: |
          test -f _site/index.html
          test -f _site/estilos.css
          test -f _site/libro-de-visitas.js

          echo "Contenido de _site:"
          find _site -maxdepth 1 -type f -print

      - name: Subir artifact de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site