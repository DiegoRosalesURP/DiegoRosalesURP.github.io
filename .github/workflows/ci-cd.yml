
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build y lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Instalar dependencias
        run: npm ci

      - name: Validar HTML con HTMLHint
        run: npx htmlhint index.html

      - name: Validar JavaScript
        run: node --check libro-de-visitas.js

      - name: Validar Python con Ruff
        run: |
          pip install ruff==0.13.1
          ruff check api tests

      - name: Validar Dockerfile de API
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --entrypoint hadolint \
            hadolint/hadolint \
            api/Dockerfile

      - name: Validar Dockerfile de Web
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --entrypoint hadolint \
            hadolint/hadolint \
            web/Dockerfile

      - name: Validar Dockerfile de DB
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            --entrypoint hadolint \
            hadolint/hadolint \
            db/Dockerfile

      - name: Crear sitio para publicación
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/
          cp estilos.css _site/
          cp libro-de-visitas.js _site/

      - name: Verificar contenido de _site
        run: |
          test -f _site/index.html
          test -f _site/estilos.css
          test -f _site/libro-de-visitas.js
          find _site -maxdepth 1 -type f -print

      - name: Subir artifact de GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Subir artifact para pruebas
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: _site

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Descargar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Instalar dependencias
        run: npm ci

      - name: Descargar sitio generado
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: _site

      - name: Ejecutar pruebas del sitio
        run: npm test

      - name: Instalar dependencias de API
        run: pip install -r api/requirements.txt

      - name: Ejecutar pruebas de API
        run: PYTHONPATH=. pytest tests/test_api.py

  package:
    name: Package
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: web
            context: .
            file: web/Dockerfile
          - name: api
            context: ./api
            file: ./api/Dockerfile

    steps:
      - name: Descargar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar metadatos de imagen
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/perfil-${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      - name: Construir y publicar imagen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=${{ matrix.name }}

  security:
    name: Security
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - web
          - api

    steps:
      - name: Descargar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generar tag de la imagen
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generar informe SARIF de Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: ghcr.io/diegorosalesurp/perfil-${{ matrix.image }}:${{ env.IMAGE_TAG }}
          trivyignores: .trivyignore
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Publicar resultados de Trivy en Code Scanning
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.image)) != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Bloquear vulnerabilidades críticas corregibles
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: image
          image-ref: ghcr.io/diegorosalesurp/perfil-${{ matrix.image }}:${{ env.IMAGE_TAG }}
          trivyignores: .trivyignore
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  sast:
    name: SAST - Semgrep
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Descargar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Analizar API y JavaScript
        run: |
          semgrep scan \
            --config auto \
            --sarif \
            --output semgrep.sarif \
            api libro-de-visitas.js

      - name: Publicar resultados de Semgrep en Code Scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep-python-javascript

  smoke:
    name: Smoke e integración API
    needs: [security, sast]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Descargar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Generar tag de las imágenes
        run: echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar imagen web publicada
        run: docker pull "ghcr.io/diegorosalesurp/perfil-web:${IMAGE_TAG}"

      - name: Descargar imagen API publicada
        run: docker pull "ghcr.io/diegorosalesurp/perfil-api:${IMAGE_TAG}"

      - name: Configurar variables de prueba
        run: |
          {
            echo "POSTGRES_DB=perfil"
            echo "POSTGRES_USER=perfil"
            echo "POSTGRES_PASSWORD=perfil"
          } >> "$GITHUB_ENV"

      - name: Crear configuración Compose para smoke
        run: |
          cat > compose.smoke.yml <<'EOF'
          services:
            web:
              image: ghcr.io/diegorosalesurp/perfil-web:${IMAGE_TAG}
              build: null
            api:
              image: ghcr.io/diegorosalesurp/perfil-api:${IMAGE_TAG}
              build: null
            db:
              image: postgres:16-alpine
              build: null
              volumes:
                - ./db/init:/docker-entrypoint-initdb.d:ro
          EOF

      - name: Validar configuración Compose
        run: docker compose -f compose.yaml -f compose.smoke.yml config -q

      - name: Levantar entorno smoke
        run: docker compose -f compose.yaml -f compose.smoke.yml up -d --wait

      - name: Verificar sitio web
        run: |
          status=$(curl --silent --show-error \
            --output response.html \
            --write-out "%{http_code}" \
            http://localhost:8080/)

          echo "Código HTTP del sitio: $status"

          if [ "$status" != "200" ]; then
            echo "El sitio no respondió con HTTP 200."
            cat response.html
            exit 1
          fi

          grep -Fq "Diego Alejandro Rosales Enciso" response.html
          echo "Sitio web disponible y nombre encontrado."

      - name: Ejecutar pruebas de integración API
        run: bash tests/integration-api.sh

      - name: Mostrar logs si falla la integración
        if: failure()
        run: docker compose -f compose.yaml -f compose.smoke.yml logs --no-color

      - name: Limpiar entorno de integración
        if: always()
        run: docker compose -f compose.yaml -f compose.smoke.yml down -v --remove-orphans

  deploy-prod:
    name: Deploy
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4