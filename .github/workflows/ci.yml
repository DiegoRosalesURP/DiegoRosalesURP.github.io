name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r api/requirements.txt

      - run: ruff check api tests

      - run: pytest
        env:
          PYTHONPATH: .

      - run: docker build -t mi-api:${{ github.sha }} ./api